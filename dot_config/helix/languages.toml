[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[[language]]
name = "json"
language-servers = ["biome"]
auto-format = true

[[language]]
name = "jsonc"
language-servers = ["biome"]
auto-format = true

[[language]]
name = "typescript"
language-servers = ["biome"]
auto-format = true
